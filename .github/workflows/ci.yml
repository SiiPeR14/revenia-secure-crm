name: Revenia quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revenia-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Local synthetic configuration
        run: cp .env.example .env.local
      - run: docker compose up -d --wait
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:all:docker
      - run: npm run test:portfolio
      - run: npm run test:lab
      - run: npm run test:ops
      - name: Production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run ops:restore-drill
      - run: docker build -t revenia:ci .
      - name: Browser report (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - name: Stop isolated CI services
        if: always()
        run: docker compose down
